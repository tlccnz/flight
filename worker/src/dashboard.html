<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flight</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:       #f9f9f9;
      --card:     #ffffff;
      --card-low: #f2f4f4;
      --card-mid: #ebeeef;
      --on:       #2d3435;
      --on-v:     #5a6061;
      --outline:  #757c7d;
      --outline-v:#adb3b4;
      --tertiary: #4a6273;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Manrope', system-ui, sans-serif;
      background: var(--bg);
      color: var(--on);
      min-height: 100vh;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(249,249,249,0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 0 2.5rem;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .wordmark {
      font-size: 0.6875rem;
      font-weight: 700;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--on);
    }

    .period-tabs {
      display: flex;
      gap: 0.25rem;
      background: var(--card-low);
      padding: 0.25rem;
      border-radius: 999px;
    }

    .period-tabs button {
      border: none;
      background: transparent;
      padding: 0.375rem 1.125rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--on-v);
      cursor: pointer;
      transition: all 0.15s;
      font-family: inherit;
    }

    .period-tabs button.active {
      background: var(--card);
      color: var(--on);
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2.5rem;
    }

    .s-label {
      font-size: 0.6875rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: var(--outline);
      margin-bottom: 0.75rem;
    }

    .card { background: var(--card); border-radius: 2rem; overflow: hidden; }

    /* ── Hero ── */
    .hero-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
      margin-bottom: 2.5rem;
    }

    .hero-card { padding: 1.75rem 2rem; }

    .hero-card .h-label {
      font-size: 0.6875rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: var(--outline);
      margin-bottom: 1rem;
    }

    .hero-card .h-metric {
      font-size: 3rem;
      font-weight: 700;
      letter-spacing: -0.04em;
      line-height: 1;
      color: var(--on);
      font-variant-numeric: tabular-nums;
    }

    .hero-card .h-sub {
      font-size: 0.75rem;
      color: var(--outline-v);
      margin-top: 0.5rem;
    }

    /* ── Heatmaps ── */
    .hm-row {
      display: grid;
      grid-template-columns: 3fr 2fr;
      gap: 1rem;
      margin-bottom: 2.5rem;
    }

    .hm-card { padding: 1.25rem 1.5rem; overflow: hidden; }

    /* Day×Hour grid */
    .dh-grid {
      display: grid;
      grid-template-columns: 28px repeat(24, 1fr);
      gap: 2px;
    }
    .dh-cell {
      height: 20px;
      border-radius: 2px;
      cursor: default;
    }
    .dh-hlabel {
      font-size: 0.5rem;
      color: var(--outline-v);
      text-align: center;
      padding-bottom: 3px;
      line-height: 1;
    }
    .dh-dlabel {
      font-size: 0.5625rem;
      color: var(--outline-v);
      display: flex;
      align-items: center;
      height: 20px;
    }

    /* Calendar grid */
    .cal-wrap {
      display: flex;
      align-items: flex-start;
      gap: 4px;
    }
    .cal-dow {
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex-shrink: 0;
    }
    .cal-dlabel {
      height: 14px;
      font-size: 0.5rem;
      color: var(--outline-v);
      line-height: 14px;
      text-align: right;
    }
    .cal-grid {
      display: grid;
      grid-template-rows: repeat(7, 14px);
      grid-auto-flow: column;
      grid-auto-columns: 14px;
      gap: 2px;
      overflow: hidden;
    }
    .cal-cell { border-radius: 2px; cursor: default; }

    /* Tooltip */
    .hm-tip {
      position: fixed;
      background: #2d3435;
      color: #fff;
      padding: 0.4rem 0.65rem;
      border-radius: 0.5rem;
      font-size: 0.6875rem;
      line-height: 1.55;
      pointer-events: none;
      white-space: nowrap;
      z-index: 100;
      opacity: 0;
      transition: opacity 0.1s;
    }
    .hm-tip.visible { opacity: 1; }

    /* ── Two-col ── */
    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 2.5rem;
    }

    /* ── Bar rows ── */
    .bar-section { padding: 1rem 0; }

    .bar-row { padding: 0.5rem 2rem; transition: background 0.1s; }
    .bar-row:hover { background: var(--card-low); }

    .bar-meta {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 0.3rem;
    }

    .bar-name {
      font-size: 0.8125rem;
      color: var(--on-v);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 78%;
    }

    .bar-count {
      font-size: 0.75rem;
      color: var(--outline-v);
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }

    .bar-track {
      height: 4px;
      border-radius: 999px;
      background: var(--card-mid);
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      border-radius: 999px;
      background: var(--tertiary);
    }

    /* ── Most Seen ── */
    .ms-head, .ms-row {
      display: grid;
      grid-template-columns: 100px 1fr 1.2fr 1.4fr 80px;
      gap: 1rem;
      padding: 0.625rem 2rem;
      align-items: center;
    }

    .ms-head {
      font-size: 0.6875rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: var(--outline-v);
    }

    .ms-row { font-size: 0.8125rem; transition: background 0.1s; }
    .ms-row:hover { background: var(--card-low); }
    .ms-row .reg { font-weight: 600; }
    .ms-row .dim { color: var(--on-v); }
    .ms-row .num { color: var(--on-v); font-variant-numeric: tabular-nums; text-align: right; }

    /* ── Table ── */
    .t-head, .t-row {
      display: grid;
      grid-template-columns: 100px 1fr 1fr 1.4fr 80px 110px 60px;
      gap: 1rem;
      padding: 0.625rem 2rem;
      align-items: center;
    }

    .t-head {
      font-size: 0.6875rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: var(--outline-v);
    }

    .t-row {
      font-size: 0.8125rem;
      transition: background 0.1s;
    }
    .t-row:hover { background: var(--card-low); }
    .t-row .reg { font-weight: 600; font-variant-numeric: tabular-nums; }
    .t-row .dim { color: var(--on-v); }
    .t-row .num { color: var(--on-v); font-variant-numeric: tabular-nums; text-align: right; }

    /* ── Watchlist ── */
    .w-head, .w-row {
      display: grid;
      grid-template-columns: 110px 1.2fr 1.6fr 140px 70px 90px;
      gap: 1rem;
      padding: 0.625rem 2rem;
      align-items: center;
    }

    .w-head {
      font-size: 0.6875rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: var(--outline-v);
    }

    .w-row { font-size: 0.8125rem; transition: background 0.1s; }
    .w-row:hover { background: var(--card-low); }
    .w-row .reg { font-weight: 600; }
    .w-row .dim { color: var(--on-v); }
    .w-row .num { color: var(--on-v); font-variant-numeric: tabular-nums; text-align: right; }

    /* ── Badges ── */
    .badge {
      display: inline-block;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      font-size: 0.625rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .b-air    { background: #e3f0fb; color: #1565c0; }
    .b-ground { background: var(--card-low); color: var(--on-v); }
    .b-notable{ background: #fff3e0; color: #e65100; }

    /* ── Empty ── */
    .empty {
      padding: 3rem 2rem;
      text-align: center;
      color: var(--outline-v);
      font-size: 0.875rem;
    }

    /* ── Responsive ── */
    @media (max-width: 960px) {
      main { padding: 1.5rem; }
      .hero-grid { grid-template-columns: repeat(2, 1fr); }
      .two-col   { grid-template-columns: 1fr; }
      .t-head, .t-row { grid-template-columns: 100px 1fr 1.4fr 80px 110px 60px; }
      .col-mfr { display: none; }
      .ms-head, .ms-row { grid-template-columns: 100px 1fr 1.4fr 80px; }
      .col-ms-mfr { display: none; }
      .w-head, .w-row { grid-template-columns: 110px 1fr 1.4fr 120px 80px; }
      .col-op  { display: none; }
    }

    @media (max-width: 1100px) {
      .t-head, .t-row { grid-template-columns: 100px 1fr 1fr 1.4fr 80px 60px; }
      .col-country { display: none; }
    }

    @media (max-width: 600px) {
      header { padding: 0 1.25rem; }
      main   { padding: 1rem; }
      .hero-grid { gap: 0.75rem; }
      .hero-card .h-metric { font-size: 2.25rem; }
    }
  </style>
</head>
<body>

<header>
  <div class="wordmark">Flight</div>
  <nav class="period-tabs">
    <button data-period="day"   class="active">Day</button>
    <button data-period="week"  >Week</button>
    <button data-period="month" >Month</button>
    <button data-period="year"  >Year</button>
  </nav>
</header>

<main>

  <!-- Hero -->
  <div class="hero-grid">
    <div class="card hero-card">
      <div class="h-label">Total Aircraft</div>
      <div class="h-metric" id="h-total">—</div>
      <div class="h-sub">all time</div>
    </div>
    <div class="card hero-card">
      <div class="h-label">Aircraft</div>
      <div class="h-metric" id="h-aircraft">—</div>
      <div class="h-sub" id="h-sub-period">last 24 hours</div>
    </div>
    <div class="card hero-card">
      <div class="h-label">Takeoffs</div>
      <div class="h-metric" id="h-takeoffs">—</div>
      <div class="h-sub" id="h-sub-takeoffs">last 24 hours</div>
    </div>
    <div class="card hero-card">
      <div class="h-label">Landings</div>
      <div class="h-metric" id="h-landings">—</div>
      <div class="h-sub" id="h-sub-landings">last 24 hours</div>
    </div>
  </div>

  <!-- Heatmaps -->
  <div class="hm-row">
    <div>
      <div class="s-label" id="dh-label">Activity by Hour</div>
      <div class="card hm-card" id="dh-card"></div>
    </div>
    <div>
      <div class="s-label">Activity Calendar <span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--outline-v);font-size:0.625rem">last 90 days</span></div>
      <div class="card hm-card" id="cal-card"></div>
    </div>
  </div>

  <div id="hm-tip" class="hm-tip"></div>

  <!-- Operators + Types -->
  <div class="two-col">
    <div>
      <div class="s-label">Top Operators</div>
      <div class="card" id="ops-card"><div class="empty">Loading…</div></div>
    </div>
    <div>
      <div class="s-label">Top Aircraft Types</div>
      <div class="card" id="types-card"><div class="empty">Loading…</div></div>
    </div>
  </div>

  <!-- Most Seen -->
  <div class="s-label">Most Frequently Seen</div>
  <div class="card" id="most-seen-card" style="margin-bottom:2.5rem">
    <div class="empty">Loading…</div>
  </div>

  <!-- Watchlist -->
  <div class="s-label">Watchlist</div>
  <div class="card" id="watch-card" style="margin-bottom:2.5rem">
    <div class="empty">Loading…</div>
  </div>

  <!-- All Aircraft -->
  <div class="s-label">All Aircraft</div>
  <div class="card" id="aircraft-card">
    <div class="empty">Loading…</div>
  </div>

</main>

<script>
  let period = 'day';

  // Period tabs
  document.querySelectorAll('.period-tabs button').forEach(btn => {
    btn.addEventListener('click', () => {
      period = btn.dataset.period;
      document.querySelectorAll('.period-tabs button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      load();
    });
  });

  // ── Helpers ──────────────────────────────────────────────────────────────

  function esc(s) {
    return s == null ? '' : String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function num(n) { return n == null ? '—' : Number(n).toLocaleString(); }

  function fmtDate(ts) {
    if (!ts) return '—';
    return new Date(ts * 1000).toLocaleDateString('en-NZ', {
      timeZone: 'Pacific/Auckland', day: 'numeric', month: 'short', year: 'numeric'
    });
  }

  function hmColor(total, max) {
    if (total === 0) return 'var(--card-mid)';
    const i = Math.max(0.12, total / max);
    return `rgba(74,98,115,${i.toFixed(2)})`;
  }

  // ── Tooltip ───────────────────────────────────────────────────────────────

  const tip = document.getElementById('hm-tip');

  function moveTip(e) {
    const x = e.clientX + 14;
    const y = e.clientY - 8;
    tip.style.left = Math.min(x, window.innerWidth - tip.offsetWidth - 10) + 'px';
    tip.style.top  = y + 'px';
  }

  function attachTips(container) {
    container.querySelectorAll('[data-tip]').forEach(el => {
      el.addEventListener('mouseenter', e => {
        tip.innerHTML = el.dataset.tip;
        tip.classList.add('visible');
        moveTip(e);
      });
      el.addEventListener('mousemove', moveTip);
      el.addEventListener('mouseleave', () => tip.classList.remove('visible'));
    });
  }

  // ── Renderers ─────────────────────────────────────────────────────────────

  function renderHero(d) {
    const sub = d.label.toLowerCase();
    document.getElementById('h-total').textContent    = num(d.hero.total_aircraft);
    document.getElementById('h-aircraft').textContent = num(d.hero.period_aircraft);
    document.getElementById('h-takeoffs').textContent = num(d.hero.period_takeoffs);
    document.getElementById('h-landings').textContent = num(d.hero.period_landings);
    ['h-sub-period','h-sub-takeoffs','h-sub-landings'].forEach(id => {
      document.getElementById(id).textContent = sub;
    });
  }

  function renderDHHeatmap(rows, label) {
    const dhLabel = { day: 'Last 24 Hours', week: 'Last 7 Days', month: 'Last 30 Days', year: 'Last Year' }[period] || '';
    document.getElementById('dh-label').textContent = `Activity by Hour — ${dhLabel}`;

    // Build lookup: dow → hour_nz → row
    const map = {};
    let maxTotal = 1;
    for (const r of rows) {
      if (!map[r.dow]) map[r.dow] = {};
      map[r.dow][r.hour_nz] = r;
      if (r.total > maxTotal) maxTotal = r.total;
    }

    // Mon(dow=1) … Sat(dow=6), Sun(dow=0)
    const days = [
      { label: 'Mon', dow: 1 }, { label: 'Tue', dow: 2 }, { label: 'Wed', dow: 3 },
      { label: 'Thu', dow: 4 }, { label: 'Fri', dow: 5 }, { label: 'Sat', dow: 6 },
      { label: 'Sun', dow: 0 },
    ];

    let html = '<div class="dh-grid">';

    // Header: corner + 24 hour labels (show every 3rd)
    html += '<div></div>';
    for (let h = 0; h < 24; h++) {
      html += `<div class="dh-hlabel">${h % 3 === 0 ? h : ''}</div>`;
    }

    // Day rows
    for (const { label: dl, dow } of days) {
      html += `<div class="dh-dlabel">${dl}</div>`;
      for (let h = 0; h < 24; h++) {
        const r     = map[dow]?.[h];
        const total = r?.total ?? 0;
        const bg    = hmColor(total, maxTotal);
        const tip   = r
          ? `<b>${dl} ${h}:00</b><br>${r.takeoffs} takeoff${r.takeoffs!==1?'s':''} &nbsp;·&nbsp; ${r.landings} landing${r.landings!==1?'s':''} &nbsp;·&nbsp; ${r.overhead} overhead`
          : `<b>${dl} ${h}:00</b><br>no activity`;
        html += `<div class="dh-cell" style="background:${bg}" data-tip="${esc(tip)}"></div>`;
      }
    }

    html += '</div>';
    const el = document.getElementById('dh-card');
    el.innerHTML = html;
    attachTips(el);
  }

  function renderCalHeatmap(rows) {
    // Build lookup: date_nz → row
    const map = {};
    let maxTotal = 1;
    for (const r of rows) {
      map[r.date_nz] = r;
      if (r.total > maxTotal) maxTotal = r.total;
    }

    // Last 90 days in NZ time
    const dates = [];
    for (let i = 89; i >= 0; i--) {
      const d = new Date(Date.now() - i * 86400000);
      dates.push(d.toLocaleDateString('en-CA', { timeZone: 'Pacific/Auckland' }));
    }

    // Pad start to align Monday (en-CA = YYYY-MM-DD; treat date as UTC noon to avoid DST shifts)
    const firstDow = (new Date(dates[0] + 'T12:00:00Z').getUTCDay() + 6) % 7; // 0=Mon
    const padded   = [...Array(firstDow).fill(null), ...dates];

    const dayLabels = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];

    let dowHtml = '<div class="cal-dow">';
    for (const dl of dayLabels) {
      dowHtml += `<div class="cal-dlabel">${dl}</div>`;
    }
    dowHtml += '</div>';

    let gridHtml = '<div class="cal-grid">';
    for (const date of padded) {
      if (!date) {
        gridHtml += '<div class="cal-cell" style="background:transparent"></div>';
      } else {
        const r     = map[date];
        const total = r?.total ?? 0;
        const bg    = hmColor(total, maxTotal);
        const tipTxt = r
          ? `<b>${date}</b><br>${r.takeoffs} takeoff${r.takeoffs!==1?'s':''} &nbsp;·&nbsp; ${r.landings} landing${r.landings!==1?'s':''} &nbsp;·&nbsp; ${r.overhead} overhead`
          : `<b>${date}</b><br>no activity`;
        gridHtml += `<div class="cal-cell" style="background:${bg}" data-tip="${esc(tipTxt)}"></div>`;
      }
    }
    gridHtml += '</div>';

    const el = document.getElementById('cal-card');
    el.innerHTML = `<div class="cal-wrap">${dowHtml}${gridHtml}</div>`;
    attachTips(el);
  }

  function renderBars(containerId, rows, nameKey, subKey) {
    const el = document.getElementById(containerId);
    if (!rows.length) { el.innerHTML = '<div class="empty">No data for this period</div>'; return; }
    el.innerHTML = '<div class="bar-section">' +
      rows.map(r => {
        const name = subKey && r[subKey] ? `${esc(r[subKey])} ${esc(r[nameKey])}` : esc(r[nameKey]);
        return `
        <div class="bar-row">
          <div class="bar-meta">
            <div class="bar-name">${name}</div>
            <div class="bar-count">${num(r.count)}</div>
          </div>
          <div class="bar-track"><div class="bar-fill" style="width:${r.pct}%"></div></div>
        </div>`;
      }).join('') +
      '</div>';
  }

  function renderMostSeen(rows) {
    const el = document.getElementById('most-seen-card');
    if (!rows.length) { el.innerHTML = '<div class="empty">No data for this period</div>'; return; }

    el.innerHTML =
      `<div class="ms-head">
        <div>Aircraft</div>
        <div class="col-ms-mfr">Manufacturer</div>
        <div>Type</div>
        <div>Operator</div>
        <div class="num">Visits</div>
      </div>` +
      rows.map(r => `
        <div class="ms-row">
          <div class="reg">${esc(r.registration) || esc(r.hex.toUpperCase())}</div>
          <div class="dim col-ms-mfr">${esc(r.manufacturer) || '—'}</div>
          <div class="dim">${esc(r.aircraft_type) || '—'}</div>
          <div class="dim">${esc(r.operator) || '—'}</div>
          <div class="num">${num(r.count)}</div>
        </div>`).join('');
  }

  function renderWatchlist(rows) {
    const el = document.getElementById('watch-card');
    if (!rows.length) { el.innerHTML = '<div class="empty">No aircraft on watchlist</div>'; return; }

    el.innerHTML =
      `<div class="w-head">
        <div>Aircraft</div><div>Type</div>
        <div class="col-op">Operator</div>
        <div>Last Seen</div>
        <div class="num">Visits</div>
        <div>Status</div>
      </div>` +
      rows.map(w => {
        const status = w.last_seen == null ? '<span class="badge b-ground">Unknown</span>'
          : w.on_ground === 0 ? '<span class="badge b-air">Airborne</span>'
          :                     '<span class="badge b-ground">Ground</span>';
        return `<div class="w-row">
          <div class="reg">${esc(w.label)}</div>
          <div class="dim">${esc(w.aircraft_type) || '—'}</div>
          <div class="dim col-op">${esc(w.operator) || '—'}</div>
          <div class="dim">${fmtDate(w.last_seen)}</div>
          <div class="num">${num(w.sighting_count)}</div>
          <div>${status}</div>
        </div>`;
      }).join('');
  }

  function renderAircraft(rows) {
    const el = document.getElementById('aircraft-card');
    if (!rows.length) { el.innerHTML = '<div class="empty">No aircraft yet</div>'; return; }

    el.innerHTML =
      `<div class="t-head">
        <div>Reg</div>
        <div class="col-mfr">Manufacturer</div>
        <div>Type</div>
        <div>Operator</div>
        <div class="col-country">Country</div>
        <div>Last Seen</div>
        <div class="num">Visits</div>
      </div>` +
      rows.map(a => `
        <div class="t-row">
          <div class="reg">${esc(a.registration) || esc(a.hex.toUpperCase())}${a.is_notable ? ' <span class="badge b-notable">Notable</span>' : ''}</div>
          <div class="dim col-mfr">${esc(a.manufacturer) || '—'}</div>
          <div class="dim">${esc(a.aircraft_type) || '—'}</div>
          <div class="dim">${esc(a.operator) || '—'}</div>
          <div class="dim col-country">${esc(a.country) || '—'}</div>
          <div class="dim">${fmtDate(a.last_seen)}</div>
          <div class="num">${num(a.sighting_count)}</div>
        </div>`).join('');
  }

  // ── Load ──────────────────────────────────────────────────────────────────

  async function load() {
    try {
      const res = await fetch(`/stats?period=${period}`);
      const d   = await res.json();

      renderHero(d);
      renderDHHeatmap(d.dh_heatmap, d.label);
      renderCalHeatmap(d.cal_heatmap);
      renderBars('ops-card',   d.top_operators, 'operator');
      renderBars('types-card', d.top_types,     'aircraft_type', 'manufacturer');
      renderMostSeen(d.most_seen);
      renderWatchlist(d.watchlist);
      renderAircraft(d.aircraft);
    } catch (err) {
      console.error('load error', err);
    }
  }

  load();
  setInterval(load, 15000);
</script>
</body>
</html>
